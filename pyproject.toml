[project]
name = "depi-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Amr Etman", email = "amretman12132@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=2.0.1",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "nbformat>=5.11.1",
    "pandas>=3.1.1",
    "psycopg2-binary>=2.9.13",
    "pyarrow>=26.0.1",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.1.9",
    "xgboost>=3.4.1",
]

[project.scripts]
depi-project = "depi_project:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
